name: GHC-01 temporary read-only formatting evidence

on:
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  evidence:
    if: github.event.pull_request.head.ref == 'agent/ghc-01-identity-isolation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format local runner copy (no writes to GitHub)
        run: |
          bun run format
          bunx biome format --write .github/tests/github-mock.ts .github/tests/identity-isolation.spec.ts
      - name: Emit formatted source text for transfer via approved connector
        shell: bash
        run: |
          set -euo pipefail
          for file in             src/workspace/identity.ts             src/github/client.ts             src/workspace/model.ts             src/workspace/context.tsx             src/workspace/storage.ts             src/workbench/persistence.ts             src/workbench/shell.tsx             src/app.tsx             src/workspace/repository-dialog.tsx             .github/tests/github-mock.ts             .github/tests/identity-isolation.spec.ts; do
            printf 'GHC_FORMAT_START %s\n' "$file"
            base64 -w0 "$file"
            printf '\nGHC_FORMAT_END %s\n' "$file"
          done

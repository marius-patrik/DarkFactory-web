name: GHC-02 temporary feature-branch formatting
on:
  push:
    branches:
      - agent/ghc-02-transactional-v3
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'marius-patrik/GHCode' && github.ref == 'refs/heads/agent/ghc-02-transactional-v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run format
      - name: Push mechanical formatting to isolated branch only
        run: |
          git config user.name "ghcode-format-bot"
          git config user.email "69584331+marius-patrik@users.noreply.github.com"
          git add -- src/workspace/storage.ts src/workspace/storage-v3.ts src/workspace/context.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(storage): apply canonical Biome formatting"
            git push origin HEAD:refs/heads/agent/ghc-02-transactional-v3
          fi

name: Normalize release candidate
on:
  push:
    branches: [feat/software-factory-workspace]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/software-factory-workspace
      - uses: oven-sh/setup-bun@v2
      - name: Format code and compile canonical documents
        run: |
          bun install
          bun run format
          python3 .github/scripts/generate_documents.py --write
      - name: Commit verified source normalization
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src .agents
          if ! git diff --cached --quiet; then
            git commit -m 'style: format workbench source and regenerate canonical documentation'
            git push origin HEAD:feat/software-factory-workspace
          fi

name: Wrkbench React 19 · GitHub Pages preview
on:
  push:
    branches:
      - pmarius/wrkbench-pages-react19
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wrkbench-pages-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install actual dependencies
        working-directory: next
        run: bun install
      - name: Validate source contracts
        working-directory: next
        run: bun run test:core
      - name: Compile application
        working-directory: next
        env:
          NODE_ENV: production
        run: bun run build
      - name: Verify entrypoint
        run: |
          test -s next/dist/index.html
          touch next/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: next/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: wrkbench-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install browser test dependencies
        working-directory: next
        run: bun install
      - name: Install Chromium
        working-directory: next
        run: bunx playwright install --with-deps chromium
      - name: Verify the actual published Pages site
        working-directory: next
        env:
          WRKBENCH_SITE_URL: https://marius-patrik.github.io/Wrkbench/
        run: bun scripts/pages-smoke.mjs
      - name: Archive visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrkbench-pages-smoke
          path: next/artifacts/pages-smoke.png
          if-no-files-found: ignore

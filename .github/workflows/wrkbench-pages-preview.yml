name: Wrkbench React 19 · GitHub Pages preview
on:
  push:
    branches:
      - pmarius/wrkbench-pages-react19
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wrkbench-pages-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install actual dependencies
        working-directory: next
        run: bun install
      - name: Validate source contracts
        working-directory: next
        run: bun run test:core
      - name: Compile application
        working-directory: next
        env:
          NODE_ENV: production
        run: bun run build
      - name: Verify entrypoint
        run: |
          test -s next/dist/index.html
          touch next/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: next/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: wrkbench-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Pin dependency resolutions
on:
  push:
    branches: [feat/software-factory-workspace]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/software-factory-workspace
      - uses: oven-sh/setup-bun@v2
      - name: Generate Bun lockfile
        run: bun install
      - name: Commit resolved immutable dependency graph
        run: |
          set -euo pipefail
          test -s bun.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m 'build: pin exact Bun dependency resolution'
            git push origin HEAD:feat/software-factory-workspace
          fi
